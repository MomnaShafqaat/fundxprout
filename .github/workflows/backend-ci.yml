name: Backend CI/CD

on:
  push:
    branches: [ "master" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test-and-build:
    name: Lint, Test & Container Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Syntax Check Core Files
        working-directory: ./backend
        run: |
          node --check index.js
          node --check server.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container & Load to Daemon
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: fundxprout-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Smoke Test
        run: |
          echo "Starting container to test boot and healthcheck..."
          docker run -d --name smoke-test-app \
            -p 5000:5000 \
            -e PORT=5000 \
            -e NODE_ENV=production \
            fundxprout-backend:test

          echo "Waiting for backend to boot..."
          sleep 6

          # Check if container is still running or crashed
          if [ "$(docker inspect -f '{{.State.Running}}' smoke-test-app)" != "true" ]; then
            echo "Container crashed on startup! Printing logs:"
            docker logs smoke-test-app
            exit 1
          fi

          # Hit health endpoint
          echo "Hitting /health endpoint..."
          curl -f http://localhost:5000/health || (echo "Health check failed! Logs:" && docker logs smoke-test-app && exit 1)

          docker stop smoke-test-app
          echo "Smoke test passed successfully!"

  deploy-to-render:
    name: Continuous Deployment (Render)
    needs: test-and-build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set yet. Skipping automatic deployment hook."
            echo "Once you add RENDER_DEPLOY_HOOK_URL to GitHub Secrets, every merge to master will auto-deploy."
          else
            echo "Triggering Render deployment..."
            curl -fsS -X POST "$RENDER_HOOK"
            echo "Deployment successfully triggered on Render!"
          fi
